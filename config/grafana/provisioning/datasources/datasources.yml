# =============================================================================
# Grafana Datasources Auto-Provisioning
# =============================================================================
# This file auto-configures Prometheus as a datasource when Grafana starts.
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
