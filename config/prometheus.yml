# =============================================================================
# Prometheus Configuration for BigTapp Agentic Chatbot
# =============================================================================

global:
  scrape_interval: 15s          # How often to scrape targets
  evaluation_interval: 15s      # How often to evaluate rules
  scrape_timeout: 10s           # Timeout for scraping

  # Attach labels to all time series
  external_labels:
    environment: 'production'
    service: 'agentic-chatbot'

# =============================================================================
# Alerting Configuration (optional - configure Alertmanager if needed)
# =============================================================================
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# =============================================================================
# Rule Files (optional - add alerting rules if needed)
# =============================================================================
# rule_files:
#   - /etc/prometheus/rules/*.yml

# =============================================================================
# Scrape Configurations
# =============================================================================
scrape_configs:

  # ---------------------------------------------------------------------------
  # Prometheus Self-Monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ---------------------------------------------------------------------------
  # BigTapp Agentic Chatbot Application
  # ---------------------------------------------------------------------------
  - job_name: 'agentic-chatbot'
    static_configs:
      # When running on Docker network (use service name)
      # - targets: ['host.docker.internal:8000']
      
      # When running on host network (use localhost)
      - targets: ['host.docker.internal:8000']
    
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    
    # Relabel to add instance label
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'agentic-main'

  # ---------------------------------------------------------------------------
  # Redis Exporter (optional - add redis_exporter container if needed)
  # ---------------------------------------------------------------------------
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # ---------------------------------------------------------------------------
  # MongoDB Exporter (optional - add mongodb_exporter container if needed)
  # ---------------------------------------------------------------------------
  # - job_name: 'mongodb'
  #   static_configs:
  #     - targets: ['mongodb-exporter:9216']
